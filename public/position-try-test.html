<!doctype html>
<html>
   <head>
      <meta charset="utf-8" />
      <title>position-try custom property test</title>
      <style>
         body {
            margin: 0;
            font-family: monospace;
         }
         .anchor {
            position: absolute;
            bottom: 24px;
            left: 60px;
            width: 120px;
            height: 28px;
            background: #369;
            anchor-name: --a;
         }
         .tip {
            position: fixed;
            position-anchor: --a;
            position-area: bottom;
            margin-top: 10px;
            width: max-content;
            padding: 6px 10px;
            background: #223;
            color: #fff;
            --arrow-top: auto;
            --arrow-bottom: 100%;
            --arrow-shift: 4px;
            --probe: base;
            position-try-fallbacks: --flip;
         }
         @position-try --flip {
            position-area: top;
            margin-top: 0;
            margin-bottom: 10px;
            --arrow-top: 100%;
            --arrow-bottom: auto;
            --arrow-shift: -4px;
            --probe: flipped;
         }
         .tip::after {
            content: "";
            position: absolute;
            left: 50%;
            width: 8px;
            height: 8px;
            background: red;
            top: var(--arrow-top);
            bottom: var(--arrow-bottom);
            transform: translate(-50%, var(--arrow-shift)) rotate(45deg);
         }
         #report {
            position: fixed;
            top: 12px;
            left: 12px;
            font-size: 20px;
            background: #fff;
            color: #000;
            padding: 8px;
         }
      </style>
   </head>
   <body>
      <div class="anchor"></div>
      <div class="tip">tooltip</div>
      <div id="report">measuring…</div>
      <script>
         requestAnimationFrame(() => {
            const tip = document.querySelector(".tip");
            const cs = getComputedStyle(tip);
            const values = ["--probe", "--arrow-top", "--arrow-bottom", "--arrow-shift"].map(
               (name) => `${name}=${cs.getPropertyValue(name).trim() || "(empty)"}`
            );
            document.getElementById("report").textContent = values.join(" | ");
         });
      </script>
   </body>
</html>
